<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | HackerRank</title>
    <style>
        *{
            margin: 0px;
        }
        body{
            background-color: rgb(150, 145, 145);
        }
        /* -------------------------------------------------------------container--------------------------------------------- */
        .container1{
            width: 550px;
            height: 505px;
            /* border: 2px solid black; */
            margin:60px auto ;
            border-radius: 10px;
            padding: 30px;
            background-color: white;
            box-shadow: 0px 0px 10px black;
        }
        .c1,.c7,.c9{
            width: 450px;
            margin: auto;
        }
        .c2,.c3{
            padding-left: 20px;
        }
        .c6>button{
            background-color: rgb(18, 158, 18);
            color: white;
            font-weight: 700;
            padding: 13px;
        }
        .a1{
            color: black;
            font-size: 35px;
            font-weight: lighter;
        }
        .a1:hover{
            color: black;
        }
        .a2,.a3{
            text-decoration: none;
        }
         .a2:hover,.a3:hover{
            text-decoration: underline;
        }
        .input1{
            width: 450px;
            margin: auto;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid black;
            
        }
        input::placeholder{
            font-size: 14px;
            color: rgb(88, 87, 87);
            padding: 10px;
        }
        /* label>input{
            font-size: 30px;
        } */
        .c9>button{
            width: inherit;
            border-radius: 10px;
            padding: 13px;
            background-color: transparent;
        }
        .c9>button:hover{
            background-color: rgb(253, 253, 252);
        }
        .c10>div>button{
            padding: 10px;
            width: 130px;
            border-radius: 10px;
        }
        .c10>div>button:hover{
            background-color: rgb(209, 208, 207);
        }
    </style>
</head>
<body>
    <div class="container1 d-flex flex-column ">
        <div class="c1 d-flex justify-content-between align-items-center">
            <div><h4>Join us</h4></div>
            <div><a class="a1" href="./home_page.html"><i class="bi bi-x-square"></i></a></div>
        </div>
        <div class="c2 mb-2"><h4>Create a HackerRank account</h4></div>
        <div class="c3 fs-6 mb-2">Be part of a 23 million-strong community of developers</div>
          <div class="c4 text-center mb-3"><input class="input1 " type="text" placeholder="Full Name"></div>
        <div class="c4 text-center mb-3"><input class="input1 " type="email" placeholder="Email"></div>
        <div class="c5 text-center mb-3"><input class="input1" type="password" placeholder="Your password"></div>
        
        <div class="c7 d-flex justify-content-between mb-4">
            <div><label><input type="checkbox"></label> I agree to HackerRank's <a class="a2" href="">Terms of sevices</a>and <a class="a3" href="">Privacy Policy</a></div>
            
        </div>
        <div class="c6 text-center mb-5"><button class="input1 " type="submit">Sign up</button></div>
        <div class="c8 mb-3 text-center">or</div>
        <div class="c9 text-center mb-4"><button><i class="bi bi-google"></i> Continue with Google</button></div>
        <!-- <div class="c10 d-flex justify-content-evenly mb-2">
            <div><button>LinkedIn</button></div>
            <div><button>GitHub</button></div>
            <div><button>Facebook</button></div>
        </div> -->
    </div>
</body>
</html>
