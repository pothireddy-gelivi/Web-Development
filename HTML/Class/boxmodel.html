<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Box Model</title>
    <style>
        div{
           
            border-radius: 20px;
            margin: 100px auto;
            box-shadow: 0px 0px 40px black;
            width:250px;
            height: 300px;
        }
        img{
            width: inherit;
            height: inherit;
            border-radius: inherit;
        }
            
    </style>
</head>
