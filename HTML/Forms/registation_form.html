<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        html
        {
            background-image: url(./1_xMuIOwjliGUPjkzukeWKfw.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
           
        }
        body
        {
            color: rgb(60, 209, 184);
            
            
            
        }
        fieldset
        {
            border-radius: 10px 10px 10px 10px ;
            width: 300px;
            flex-direction: column;
            flex-flow: row;
            margin-top: 150px;
            margin-left: 500px;
            border-color: rgb(235, 216, 216);
            padding-bottom: 10px;
            background-color: rgba(136, 121, 121, 0.603);    
        }
        input
        {
            border-radius: 7px;
            margin: 10px;
            padding: 5px;
            padding-left: 100px;
            background: transparent;
            border-color:white;
            
        }
        button
        {
            padding: 5px;
            padding-left: 122px;
            padding-right: 122px;
            border-radius: 10px;
            border-color: white;
            color: brown;
            background-color: aqua;
            border: none;
        }
        span
        {
            border-radius: 10px;
            padding-left: 10px;
            padding-right: 10px;
            text-align: center;
            background-color:white;
        }
        tr
        {
            margin: auto;
        }
        input::placeholder
        {
            color:rgb(60, 209, 184);
        }
        input label
        {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body  >
    <form >
        <fieldset >
            <table align="center" >
                <tr align="center" colspan="2">
                    <td><h1>Registration</h1></td>
                </tr>
                <tr colspan="2">
                    <td><input type="text" placeholder="Username"></td>
                </tr>
                <tr colspan="2">
                    <td><input type="email" placeholder="Email"></td>
                </tr>
                <tr colspan="2">
                    <td><input type="password" name="" id="" placeholder="Password"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" id="rem"><label for="rem">Remember me</label>
                    <label for="">Forgot Password?</label></td>
                </tr>
                <tr  align="center">
                    <td><button>Submit</button></td> 
                </tr>
                <tr align="center">
                    <td><label for="">Dont have an account? <b><a href="./login_page.html">Log In</a></b></label></td>
                </tr>
            </table>
        </fieldset>
    </form>
    
</body>
</html>
