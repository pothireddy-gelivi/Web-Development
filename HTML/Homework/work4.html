<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Frame</title>
    <style>
        body
        {
            background-image: url(https://w0.peakpx.com/wallpaper/239/942/HD-wallpaper-neon-lines-background-dark-abstract-abstraction-lines-light-background-neon-lines.jpg);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .items
        {
            height: 200px;
            width: 200px;
            border: 10px solid rgb(1, 252, 97);
            position: relative;
        }
        #d1
        {
            top: 270px;
            left: 400px;
        }
        #d2
        {
            top: 50px;
            left: 720px;
        }
        #d3
        {
            margin: auto;
            z-index: 1;
            

        }
        #d4
        {
            left: 400px;
            bottom: 50px;
        }
        #d5
        {
            left: 720px;
            bottom: 270px;
        }
        img
        {
            height: inherit;
            width: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="d1">
            <img src="./me (2).jpg" alt="">
        </div>
        <div class="items" id="d2">
            <img src="./chinni.jpg" alt="">
        </div>
        <div class="items" id="d3">
            <img src="./family.png" alt="">
        </div>
        <div class="items" id="d4">
            <img src="./profile.jpg" alt="">
        </div>
        <div class="items" id="d5">
            <img src="./chinni.jpg" alt="">
        </div>
    </div>
</body>
</html>
