<!-- different places of boxes -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work-1</title>
    <style>
        div {

            width: 250px;
            height: 120px;
            border-radius: 10px;
            background-color: aqua;
        }

        .one {
            background-color: darkcyan;
            border: 4px solid rgb(228, 65, 127);
        }

        .two {
            margin-left: 270px;
            background-color: chartreuse;
            border: 4px solid red;
        }

        .three {
            margin: auto;
            background-color: blueviolet;
            border: 4px solid rgb(191, 231, 43);
        }

        .four {
            margin: auto;
            margin-right: 270px;
            background-color: chocolate;
            border: 4px solid rgb(43, 231, 59);
        }

        .five {
            margin: auto;
            margin-right: 20px;
            background-color: burlywood;
            border: 4px solid rgb(47, 54, 18);
        }
        .six{
              background-color: rgb(230, 98, 186);
            border:4px solid rgb(110, 83, 233);
        }
    </style>
</head>

<body>
    <div class="one">

    </div>
    <div class="two">

    </div>
    <div class="three">

    </div>
    <div class="four">

    </div>
    <div class="five">

    </div>
    <div class="six">

    </div>
</body>

</html>
