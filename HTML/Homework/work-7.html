<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
        }
        .container{
            margin:50px auto;
            border: 2px solid red;
            height: 500px;
            width: 90%;
            display: grid;
            grid-template-columns: repeat(3,auto);
            gap: 10px;
        }
        .items{
            background-color: blue;
        }
        .three{
            grid-column: 3/4;
            grid-row: 1/3;
        }
         .four{
            grid-column: 1/3;
            grid-row: 2/3;
        }
         .six{
            grid-column: 2/4;
            grid-row: 3/4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">Item-1</div>
        <div class="items">Item-2</div>
        <div class="items three">Item-3</div>
        <div class="items four">Item-4</div>
        <div class="items">Item-5</div>
        <div class="items six">Item-6</div>
        
        
    </div>
</body>
</html>
