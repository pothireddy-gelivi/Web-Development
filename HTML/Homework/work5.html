<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>header</title>
    <style>
        *{
            margin: 0px;
        }
        a
        {
            background-color: chartreuse;
            
        }
        .container
        {
           
            cursor: pointer;
            display: none;
            
            width: 150px;
          
        }
        .reddy:hover>.container
        {
            display: block;
        }
        .items{
            border: 2px solid red;
            height: 20px;
            width: 100px;
            padding: 10px;
           
        }
    </style>
</head>
<body>
    <div class="reddy">
        <h1>reddy</h1>
        <div class="container">
            <a class="items" href="">Home</a> <br>
            <a class="items" href="">Contacts</a> <br>
            <a class="items" href="">Settings</a> <br>
            <a class="items" href="">About</a><br>
        </div>
    </div>
</body>
</html>
