<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Row span</title>
</head>
<body>
    <h1><b>ROW SPAN</b></h1>
    <table border="2px" width="200px" cellpadding="25px">
        <tbody>
            <tr>
                <th rowspan="2">UG</th>
                <th>B.TECH</th>
            </tr>
            <tr>
                <th>B.COM</th>
            </tr>
            <tr>
                <th rowspan="2">PG</th>
                <th>M.TECH</th>
            </tr>
            <tr>
                <th>M.COM</th>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
