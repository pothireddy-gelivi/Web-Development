<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let ch=prompt("Enter the character: ")
        ch=ch.toLowerCase()
        switch (ch) {
            case "a":
            case "e":
            case "i":
            case "o":
            case "u":
                console.log(`${ch} is a vowel`)
                break;
            default:
                console.log(`${ch} is a consonant`)
                break;
        }
    </script>
</head>
<body>
    
</body>
</html>
