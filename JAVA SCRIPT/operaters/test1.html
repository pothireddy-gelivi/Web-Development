<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaters</title>
    <script>
        let a=4;
        let b=5
        console.log(`${a} + ${b} = ${a+b}`);
        console.log(`${a} - ${b} = ${a-b}`);
        console.log(`${a} * ${b} = ${a*b}`);
        console.log(`${a} / ${b} = ${a/b}`);
        console.log(`${a} % ${b} = ${a%b}`);

        console.log(Math.trunc(2.7));
        console.log(Math.trunc(3.4));
        console.log("a value is "+a)
    </script>
</head>
<body>
    <h1>Operaters in Javascript</h1>
</body>
</html>
