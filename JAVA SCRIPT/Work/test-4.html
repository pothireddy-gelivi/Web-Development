<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Test-4</title>
    <style>
        .container1{
            width: 800px;
            height: 400px;
            border: 2px solid black;
            padding: 20px;
            display: flex;
            margin:auto;
        }
        .cont-11,cont-12{
            width: 350px;

        }
    </style>
</head>
<body>
    <div class="container1 m-3">
        <div class="m-3 cont-11">
            <div class="row">
                <div class="col-3">num-1 :</div>
                <div class="col-9"><input type="text" placeholder="Enter the num1 Value" id="value-1"></div>
            </div>
            <div class="row my-3">
                <div class="col-3">num-2 :</div>
                <div class="col-9"><input type="text" placeholder="Enter the num2 Value" id="value-2"></div>
            </div>
            <div class="row my-3">
                <div class="col-6">
                        <button class="btn btn-primary" id="add-btn">Add</button>
                </div>
                <div class="col-6 text-center">
                        <button class="btn btn-success" id="sum-btn">Sum of All</button>
                </div>
            </div>
        </div>
        <div class="cont-12 d-flex ms-3">
            <div class="">
                <h4>Num-1</h4>
                <div class="table" id="display-value1">
                   
                </div>
            </div>
            <div class="ms-5">
                <h4>Num-2</h4>
                <div class="table" id="display-value2">
                 
                </div>
            </div>
        </div>
        
    </div>
    <script>
        let value_1=document.getElementById("value-1")
        let value_2=document.getElementById("value-2")
        let add_btn=document.getElementById("add-btn")
        let sum_btn=document.getElementById("sum-btn")
        let display_value1=document.getElementById("display-value1")
        let display_value2=document.getElementById("display-value2")
        let num1=[]
        let num2=[]
       
        
         
        sum_btn.addEventListener("click",()=>{
            let combined=num1.concat(num2)
            let total=0
            for (let val of combined){
                    total += val ;
            }
            console.log(total)
           alert(`total is : ${total}`)
           
        })
        add_btn.addEventListener("click",()=>{
            num1.push(Number(value_1.value))
            num2.push(Number(value_2.value))
            display1(num1)
            display2(num2)
            value_1.value=""
            value_2.value=""
        })

        

        function display1(arr) {
            let res = ``;
            arr.forEach((ele) => {
                res += `
                <ul>
                    
                    <li>${ele}</li>
                </ul>
                `
            });
            display_value1.innerHTML = res;
            
        }
        function display2(arr) {
            let res = ``;
            arr.forEach((ele) => {
                res += `
                <ul>
                    
                    <li>${ele}</li>
                </ul>
                `
            });
            display_value2.innerHTML = res;
            
        }
    </script>
</body>
</html>
