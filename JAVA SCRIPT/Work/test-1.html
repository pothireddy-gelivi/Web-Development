<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Task-1</title>
</head>
<body>
    <div class="w-25 m-auto mt-5">
        <div class="card">
            <div class="card-body">
                <textarea name="" id="text-area" class="form-control" placeholder="Enter your Message....."></textarea>
            </div>
            <div class="card-footer text-center">
                <div class="row">
                    <div class="col-4">
                        <button class="btn btn-danger" id="clear-btn">Clear</button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-info" id="back-btn">Backspace</button>
                    </div>
                    <div class="col-4">
                        <button class="btn btn-primary" id="count-btn">Count</button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 text-end pe-5" id="count-value">0</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let clear_btn=document.getElementById("clear-btn")
        let back_btn=document.getElementById("back-btn")
        let count_btn=document.getElementById("count-btn")
        let text_area=document.getElementById("text-area")
        let count_value=document.getElementById("count-value")

        clear_btn.addEventListener("click", () => {
            text_area.value = "";
        });

        
        back_btn.addEventListener("click", () => {
            text_area.value = text_area.value.slice(0, -1);
        });

        count_btn.addEventListener("click", () => {
            let charCount = text_area.value.length;
            count_value.innerText=charCount;
           
        });

        


    </script>
</body>
</html>
