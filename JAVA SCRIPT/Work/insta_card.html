<!DOCTYPE html>
<html lang="en">
<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>(1) Instagram</title>
    <style>
        .profile{
            border: 2px solid rgb(243, 125, 15);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            z-index: 1;
            cursor: pointer;
        }
        .profile img{
            height: 56px;
            width: 56px;
            border-radius: inherit;
            z-index: 0;
        }
        .middle h5{
            font-size: 18px;
            cursor: pointer;
        }
        .middle h6{
            font-size: 12px;
            padding-left: 5px;
            cursor: pointer;
        }
        .last {
            font-size: 20px;
            cursor: pointer;
        }
        .heart{
            font-weight:900;
            font-size: 25px;
            
        }
        .heart:hover{
            color: gray;
            cursor: pointer;
            
        }
         .chat{
            font-weight:900;
            font-size: 25px;
        }
        .chat:hover{
            color: gray;
            cursor: pointer;
        }
         .send{
            font-weight:900;
            font-size: 25px;
        }
        .send:hover{
            color: gray;
            cursor: pointer;
        }
         .bookmark{
            font-weight:900;
            font-size: 25px;
        }
        .bookmark:hover{
            color: gray;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="w-25 mt-3 m-auto">
        <div class="card ">
            <div class="card-header">
                <div class="row">
                    <div class="col-2">
                        <div class="profile"><img  src="../../images/profile.jpg" alt=""></div>
                    </div>
                    <div class="col-8 px-4 middle align-items-center">
                        <h5>pothireddy.gelivi</h5>
                        <h6>Original audio</h6>
                    </div>
                    <div class="col-2 align-items-center last"><i class="bi bi-three-dots"></i></div>
                </div>
            </div>
            <div class="card-body">
                <img src="../../images/profile.jpg" class="img-fluid" alt="">
            </div>
            <div class="card-footer">
                <div class="row icons">
                    <div class="col-2"><i class="bi bi-heart heart" id="like-btn" onclick="increment"></i></div>
                    <div class="col-2"><i class="bi bi-chat chat"></i></div>
                    <div class="col-6"><i class="bi bi-send send"></i></div>
                    <div class="col-2"><i class="bi bi-bookmark bookmark"id="bookmark-btn"></i></div>
                </div>
                <div class="row text-start px-4"id="likes"> 0 likes</div>
                <div class="row"><p><b>pothireddy.gelivi </b> My new Profile Photo ....more</p></div>
                <div><input type="text" name="" id="" class="form-control " placeholder="add a Comment"></div>
            </div>
        </div>
    </div>
    
    <script>
        let like_btn=document.getElementById("like-btn")
        let likes_count= document.getElementById("likes")
        let bookmark_btn=document.getElementById("bookmark-btn")
        let count=0
        like_btn.addEventListener("click",()=>{
            if (like_btn.classList.contains("bi-heart")){
                like_btn.classList.remove("bi-heart")
                like_btn.classList.add("bi-heart-fill")
                like_btn.style.color = "red";
                count+=1
               }
            
            else{
                if (like_btn.classList.contains("bi-heart-fill")){
                like_btn.classList.remove("bi-heart-fill")
                like_btn.classList.add("bi-heart")
                like_btn.style.color = "gray";
                    count-=1
            }}
             likes_count.textContent = count + " likes";
        })

        bookmark_btn.addEventListener("click",()=>{
            if (bookmark_btn.classList.contains("bi-bookmark")){
                bookmark_btn.classList.remove("bi-bookmark")
                bookmark_btn.classList.add("bi-bookmark-fill")
               
               }
            
            else{
                if (bookmark_btn.classList.contains("bi-bookmark-fill")){
                bookmark_btn.classList.remove("bi-bookmark-fill")
                bookmark_btn.classList.add("bi-bookmark")
              
            }}
          
        })
       
    </script>
</body>
</html>
