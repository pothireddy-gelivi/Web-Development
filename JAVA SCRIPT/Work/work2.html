<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Document</title>
    <style>
        .bg-color {
            background: linear-gradient(45deg, black, cyan);
            color: white;
        }
        .hide{
            display: none;
        }
    </style>
</head>

<body>
    <nav class="nav navbar navbar-dark bg-color p-3">
        <a href="#" class="navbar-brand">Form Apllication</a>
        <button class="btn btn-warning" id="login-btn">Log in </button>
    </nav>
    <section >
        <div class="w-50 my-5 m-auto hide" id="display-ele">
            <div class="card">
                <div class="card-header bg-color text-center">
                    <div class="row">
                        <div class="col-10">
                            <h1>Login Form</h1>
                        </div>
                        <div class="col-2">
                            <h1 id="cross">❌</h1>
                        </div>
                    </div>
                </div>
                <div class="card-body ">
                    <input type="text" placeholder="Enter the UserName" class="form-control my-3">

                    <div class="input-group mb-3">
                        <input type="password" id="matter" class="form-control" placeholder="Enter the Password" aria-label="Username" aria-describedby="basic-addon1">
                        <span class="input-group-text" id="basic-addon1"><i class="bi bi-eye-fill" id="icon"></i></span>
                    </div>
                </div>
                <div class="text-center">
                    <button class="btn bg-color mb-3">SUBMIT</button>
                </div>
            </div>
        </div>
    </section>
    <script>
        let login_btn=document.getElementById("login-btn");
        let display_ele=document.getElementById("display-ele");
        let cross_btn=document.getElementById("cross");
        let icon=document.getElementById("icon");
        let matter_1=document.getElementById("matter");
        login_btn.addEventListener("click",function(){
            display_ele.classList.remove("hide");
        })
        cross_btn.style.cursor="pointer"
        icon.style.cursor="pointer"
        cross_btn.addEventListener("click",function(){
            display_ele.classList.add("hide") 
        })
        icon.addEventListener("click",function(){
            if (icon.classList.contains("bi-eye-fill")){
            icon.classList.remove("bi-eye-fill")
            icon.classList.add("bi-eye-slash-fill")
            matter_1.setAttribute("type","text")

        }
        else{
            if (icon.classList.contains("bi-eye-slash-fill")){
            icon.classList.remove("bi-eye-slash-fill")
            icon.classList.add("bi-eye-fill") 
            matter_1.setAttribute("type","password")
        }
        }
        })
     

    </script>
</body>

</html>
