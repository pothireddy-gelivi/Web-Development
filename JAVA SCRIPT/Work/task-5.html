<!DOCTYPE html>
<html lang="en">
<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Test-5</title>
    <style>
        .container1 {
            width: 80%;
            height: 70vh;
            border: 2px solid black;
            margin: auto;
            position: relative;
        }
        .ball {
            width: 60px;
            height: 60px;
            position: absolute;
            top: 200px;
            left: 500px;
            transition: all 0.2s ease;
        }
        img {
            width: inherit;
            height: inherit;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container1">
        <div class="ball" id="ball">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/004/279/311/small_2x/soccer-ball-background-isolated-free-photo.jpg" alt="">
        </div>
    </div>

    <div class="container2">
        <div class="row text-center">
            <div class="col-12">
                <button class="btn btn-danger" id="up-btn"><i class="bi bi-chevron-up"></i></button>
            </div>
        </div>
        <div class="row">
            <div class="col-5 text-end">
                <button class="btn btn-danger" id="left-btn"><i class="bi bi-chevron-left"></i></button>
            </div>
            <div class="col-2"></div>
            <div class="col-5 text-start">
                <button class="btn btn-danger" id="right-btn"><i class="bi bi-chevron-right"></i></button>
            </div>
        </div>
        <div class="row text-center">
            <div class="col-12">
                <button class="btn btn-danger" id="down-btn"><i class="bi bi-chevron-down"></i></button>
            </div>
        </div>
    </div>

    <script>
        let up_btn = document.getElementById("up-btn");
        let left_btn = document.getElementById("left-btn");
        let right_btn = document.getElementById("right-btn");
        let down_btn = document.getElementById("down-btn");
        let ball = document.getElementById("ball");
       
        let toppos = 200;
        let leftpos = 500;
        const movestep = 20;

        up_btn.addEventListener("click", () => {
            toppos -= movestep;
            ball.style.top = toppos + "px";
        });

        down_btn.addEventListener("click", () => {
            toppos += movestep;
            ball.style.top = toppos + "px";
        });

        left_btn.addEventListener("click", () => {
            leftpos -= movestep;
            ball.style.left = leftpos + "px";
        });

        right_btn.addEventListener("click", () => {
            leftpos += movestep;
            ball.style.left = leftpos + "px";
        });
    </script>
</body>
</html>
