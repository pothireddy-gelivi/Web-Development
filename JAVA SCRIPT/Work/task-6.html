<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Test-6</title>
    <style>
        .cont1 {
            display: flex;
            margin: 10px auto;
            width: 600px;
            height: 250px;
        }
        .cont11, .cont12 {
            width: 200px;
            height: 150px;
            border: 4px solid black;
            margin: 40px;
            cursor: pointer;
        }
        .cont11 {
            background-color: red;
            color: whitesmoke;
        }
        .cont12 {
            background-color: green;
            color: whitesmoke;
        }
        .cont11 span, .cont12 span {
            display: inline-block;
            margin-top: 50px;
            margin-left: 30px;
            font-size: 25px;
        }
        .cont2 {
            display: flex;
            width: 60%;
            margin: auto;
            height: 100px;
            align-items: center;
            padding-left: 200px;
        }
        .cont2 .para {
            margin-right: 20px;
        }
        .cont3 {
            width: 90%;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: green;
            cursor: pointer;
            border: 2px solid black;
        }
        .selected {
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="cont1">
        <div class="cont12" id="cre-btn"><span>Create Circle</span></div>
        <div class="cont11" id="del-btn"><span>Delete Circle</span></div>
    </div>

    <div class="cont2">
        <div class="para">Total no of circles Created: <span id="cir-val">0</span></div>
        <div class="para">Total no of circles selected: <span id="sel-cir-val">0</span></div>
    </div>

    <div class="cont3" id="circle"></div>

    <script>
        const create_btn = document.getElementById("cre-btn");
        const delete_btn = document.getElementById("del-btn");
        const circles_value = document.getElementById("cir-val");
        const selected_circles_value = document.getElementById("sel-cir-val");
        const display_circle = document.getElementById("circle");

        let totalCircles = 0;
        let selectedCircles = 0;

     
        create_btn.addEventListener("click", () => {
            const newCircle = document.createElement("div");
            newCircle.classList.add("circle");

            
            newCircle.addEventListener("click", () => {
                newCircle.classList.toggle("selected");
                if (newCircle.classList.contains("selected")) {
                    selectedCircles++;
                } else {
                    selectedCircles--;
                }
                selected_circles_value.textContent = selectedCircles;
            });

            display_circle.appendChild(newCircle);
            totalCircles++;
            circles_value.textContent = totalCircles;
        });

        
        delete_btn.addEventListener("click", () => {
            const circles = document.querySelectorAll(".circle");
            if (circles.length > 0) {
                const lastCircle = circles[circles.length - 1];
                if (lastCircle.classList.contains("selected")) {
                    selectedCircles--;
                    selected_circles_value.textContent = selectedCircles;
                }
                lastCircle.remove();
                totalCircles--;
                circles_value.textContent = totalCircles;
            }
        });
    </script>
</body>
</html>
